<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator-container">
    <h1 class="calculator-title">Simple Calculator</h1>
    <div class="calculator">
      <div class="calculator-display">
        <div class="calculator-expression" id="expression"></div>
        <div class="calculator-result" id="display">0</div>
      </div>
      <div class="calculator-buttons" id="calculator-buttons">
        <button class="btn btn-function" data-action="clear" type="button">C</button>
        <button class="btn btn-function" data-action="delete" type="button">&#9003;</button>
        <button class="btn btn-operator" data-action="operator" data-value="&divide;" type="button">&divide;</button>
        <button class="btn btn-operator" data-action="operator" data-value="&times;" type="button">&times;</button>

        <button class="btn" data-action="digit" data-value="7" type="button">7</button>
        <button class="btn" data-action="digit" data-value="8" type="button">8</button>
        <button class="btn" data-action="digit" data-value="9" type="button">9</button>
        <button class="btn btn-operator" data-action="operator" data-value="&minus;" type="button">&minus;</button>

        <button class="btn" data-action="digit" data-value="4" type="button">4</button>
        <button class="btn" data-action="digit" data-value="5" type="button">5</button>
        <button class="btn" data-action="digit" data-value="6" type="button">6</button>
        <button class="btn btn-operator" data-action="operator" data-value="+" type="button">+</button>

        <button class="btn" data-action="digit" data-value="1" type="button">1</button>
        <button class="btn" data-action="digit" data-value="2" type="button">2</button>
        <button class="btn" data-action="digit" data-value="3" type="button">3</button>
        <button class="btn btn-equals" data-action="equals" type="button">=</button>

        <button class="btn btn-zero" data-action="digit" data-value="0" type="button">0</button>
        <button class="btn" data-action="decimal" type="button">.</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
